# In-cluster deployment of the G4 Colo at Scale live dashboard.
# Pinned strictly to the dedicated `loadgen` node pool (colo.role=loadgen) so it has
# zero CPU, memory, or network impact on G4 GPU nodes or N4D CPU overflow nodes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: colo-demo
  namespace: colo-system
---
# RBAC (finding 1.11): cluster-wide access is read-only and limited to what the map needs.
# Writes (pod proxy POSTs, HPA/Deployment scale for the demo accelerator, config reads) are
# namespaced Roles in inference / colo-system / colo-svc only.
#
# Subjects: edit the `subjects:` list of each of the 4 bindings below (keep them identical). The Cloud Run
# demo runs as a dedicated Google service account, mapped to a Kubernetes User by its email.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: colo-demo-read
rules:
- apiGroups: [""]
  resources: [nodes, pods, events]
  verbs: [get, list, watch]
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: colo-demo-read
subjects:
- kind: ServiceAccount
  name: colo-demo
  namespace: colo-system
- kind: User
  name: colodemo-run@northam-ce-mlai-tpu.iam.gserviceaccount.com
  apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: colo-demo-read
---
# inference: loadgen /rate + /stats through the pod proxy; vLLM HPA/Deployment scale (demo accelerator only).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: colo-demo
  namespace: inference
rules:
- apiGroups: [""]
  resources: [pods/proxy]
  verbs: [get, create]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments/scale]
  resourceNames: [vllm]
  verbs: [get, patch, update]
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [get, list, watch]
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  resourceNames: [vllm]
  verbs: [patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: colo-demo
  namespace: inference
subjects:
- kind: ServiceAccount
  name: colo-demo
  namespace: colo-system
- kind: User
  name: colodemo-run@northam-ce-mlai-tpu.iam.gserviceaccount.com
  apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: colo-demo
---
# colo-system: controller /state, /config, /baseline and node-agent /cpus through the pod proxy;
# the colo-config ConfigMap as a fallback when the controller is down; the colo-buffer Deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: colo-demo
  namespace: colo-system
rules:
- apiGroups: [""]
  resources: [pods/proxy]
  verbs: [get, create]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [colo-config]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: colo-demo
  namespace: colo-system
subjects:
- kind: ServiceAccount
  name: colo-demo
  namespace: colo-system
- kind: User
  name: colodemo-run@northam-ce-mlai-tpu.iam.gserviceaccount.com
  apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: colo-demo
---
# colo-svc: read the backfill/overflow Deployments.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: colo-demo
  namespace: colo-svc
rules:
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: colo-demo
  namespace: colo-svc
subjects:
- kind: ServiceAccount
  name: colo-demo
  namespace: colo-system
- kind: User
  name: colodemo-run@northam-ce-mlai-tpu.iam.gserviceaccount.com
  apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: colo-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: colo-demo
  namespace: colo-system
  labels: {app: colo-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app: colo-demo}
  template:
    metadata:
      labels: {app: colo-demo}
    spec:
      serviceAccountName: colo-demo
      # Strictly isolated to the control/loadgen node pool; never schedules on G4 or N4D nodes.
      nodeSelector:
        colo.role: loadgen
      containers:
      - name: demo
        image: us-west8-docker.pkg.dev/northam-ce-mlai-tpu/repo-jawadamin-us-west8-1026/colo-demo:v0.2.5
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8088
        resources:
          requests: {cpu: 200m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        readinessProbe:
          httpGet: {path: /api/scenario/status, port: 8088}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: colo-demo
  namespace: colo-system
  labels: {app: colo-demo}
# ClusterIP only: the app has no auth of its own and can drive the cluster, so it must not be reachable
# from the VPC. Access it with `kubectl -n colo-system port-forward svc/colo-demo 8088:80`; the shareable
# path is the Cloud Run service behind IAP.
spec:
  type: ClusterIP
  selector:
    app: colo-demo
  ports:
  - name: http
    port: 80
    targetPort: 8088

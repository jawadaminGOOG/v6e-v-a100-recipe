apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-backfill
  namespace: colo-svc
  labels: {app: sandbox, colo.tier: backfill, colo.class: integer}
spec:
  # No `replicas:` field: this is the service's demand. Your HPA (or `kubectl scale`) owns it.
  selector: {matchLabels: {app: sandbox, colo.tier: backfill}}
  template:
    metadata:
      labels: {app: sandbox, colo.tier: backfill, colo.class: integer}
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        colo.gke.io/sandbox-runtime-reason: "default-runc-on-g4: gVisor runsc-sandbox runs in pod cgroup (0-47) bypassing kubelet static CPU manager container cpuset and contending with vLLM cores (P6 probe: 50ms vs 20ms baseline; runc control: 22ms)"
    spec:
      priorityClassName: colo-backfill
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: cloud.google.com/compute-class, operator: In, values: [g4-gpu]}
        # The whole placement rule. A backfill pod binds only to a node that already runs a vLLM pod, so:
        #   - it never lands on a G4 node without vLLM (empty, or draining after vLLM scale-in);
        #   - the cluster autoscaler never adds a G4 node for it: CA simulates a new node from the pool template,
        #     which has no vLLM pod, so the pod does not fit (and priority -100 is below CA's cutoff anyway);
        #   - when vLLM lands on a new G4 node, Pending backfill pods bind there by themselves.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app: vllm}}
            namespaces: [inference]
            topologyKey: kubernetes.io/hostname
      tolerations:
      - {key: cloud.google.com/compute-class, operator: Equal, value: g4-gpu, effect: NoSchedule}
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      terminationGracePeriodSeconds: 10
      containers:
      - name: worker
        image: colo-registry.invalid/colo-worker:v0.2.4
        imagePullPolicy: IfNotPresent
        env:
        - {name: MODE, value: sandbox}
        ports: [{name: metrics, containerPort: 9100}]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        # Guaranteed QoS + integer CPU => exclusive cores (and admission-policy compliant on G4 nodes).
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "2", memory: 4Gi}


# Scenario 1 overlay: GPU scale-out (1200 rps -> HPA adds vLLM #2 -> G4 #2 -> backfill fills spare slots).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../demo   # demo images, node pools and settings; this overlay only changes demand and load
patches:
- target: {kind: ConfigMap, name: colo-config, namespace: colo-system}
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: colo-config, namespace: colo-system}
    data:
      config.json: |
        {"demand": {"sandbox": 18, "toolcall": 18, "analytics": 0},
         "guard": {"enabled": false, "baseline_ttft_p99_ms": 20, "factor": 1.5, "cooldown_s": 600, "window_s": 30},
         "buffer_replicas": 15}
- target: {kind: Deployment, name: loadgen, namespace: inference}
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "1200"

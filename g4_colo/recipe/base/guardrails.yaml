# Guardrails: only expendable, Guaranteed, integer-CPU, GPU-free pods (or the GPU workload) may target G4 nodes;
# per-namespace quota for CPU services; network isolation for agentic sandboxes.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: colo-g4-guard}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE]
      resources: [pods]
  variables:
  - name: targetsG4
    expression: >-
      (has(object.spec.tolerations) && object.spec.tolerations.exists(t,
        has(t.key) && t.key == 'cloud.google.com/compute-class' && has(t.value) && t.value == 'g4-gpu'))
      || (has(object.spec.nodeSelector) && 'cloud.google.com/compute-class' in object.spec.nodeSelector
        && object.spec.nodeSelector['cloud.google.com/compute-class'] == 'g4-gpu')
  - name: wantsGPU
    expression: >-
      object.spec.containers.exists(c, has(c.resources) && has(c.resources.limits)
        && 'nvidia.com/gpu' in c.resources.limits)
  - name: guaranteedIntegerCPU
    expression: >-
      object.spec.containers.all(c, has(c.resources) && has(c.resources.requests) && has(c.resources.limits)
        && 'cpu' in c.resources.requests && 'cpu' in c.resources.limits
        && 'memory' in c.resources.requests && 'memory' in c.resources.limits
        && c.resources.requests['cpu'] == c.resources.limits['cpu']
        && c.resources.requests['memory'] == c.resources.limits['memory']
        && string(c.resources.requests['cpu']).matches('^[0-9]+$'))
  validations:
  - expression: >-
      !variables.targetsG4
      || (namespaceObject.metadata.name == 'inference' && variables.wantsGPU && variables.guaranteedIntegerCPU)
      || (has(object.spec.priorityClassName) && object.spec.priorityClassName == 'colo-backfill'
          && !variables.wantsGPU && variables.guaranteedIntegerCPU)
    messageExpression: >-
      'pods targeting G4 nodes must be the GPU workload (namespace inference, GPU, Guaranteed integer CPU) or '
      + 'expendable backfill (priorityClassName colo-backfill, no GPU, integer CPU, requests == limits)'
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: colo-g4-guard}
spec:
  policyName: colo-g4-guard
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, gmp-system, gke-managed-system, colo-system, gke-gmp-system, kube-node-lease]
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: colo-svc-quota, namespace: colo-svc}
spec:
  hard:
    requests.cpu: "120"
    limits.memory: 400Gi
    requests.nvidia.com/gpu: "0"
---
# Agentic sandboxes may only reach the tool-calling service and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sandbox-egress, namespace: colo-svc}
spec:
  podSelector: {matchLabels: {app: sandbox}}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: {matchLabels: {app: toolcall}}
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# vLLM accepts traffic only from the load generator (and Managed Prometheus scrapes).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: vllm-ingress, namespace: inference}
spec:
  podSelector: {matchLabels: {app: vllm}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: loadgen}}
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gmp-system}}
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: colo-system}}

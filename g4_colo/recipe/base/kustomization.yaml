# Base: environment-neutral. Do not apply directly. Images point at the placeholder registry
# `colo-registry.invalid` and ComputeClasses at `your-g4-node-pool` / `your-n4d-node-pool`.
# Overlays set registry, image tags, node pool names and the model in one place
# (overlays/<name>/kustomization.yaml `images:` + overlays/<name>/settings.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- cluster.yaml
- custom-metrics-adapter.yaml
- vllm.yaml
- loadgen.yaml
- controller.yaml
- colo-services.yaml
- guardrails.yaml

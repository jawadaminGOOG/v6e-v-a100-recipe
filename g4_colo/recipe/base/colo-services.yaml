apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-backfill
  namespace: colo-svc
  labels: {app: sandbox, colo.tier: backfill, colo.class: integer}
spec:
  replicas: 0
  selector: {matchLabels: {app: sandbox, colo.tier: backfill}}
  template:
    metadata:
      labels: {app: sandbox, colo.tier: backfill, colo.class: integer}
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        colo.gke.io/sandbox-runtime-reason: "default-runc-on-g4: gVisor runsc-sandbox runs in pod cgroup (0-47) bypassing kubelet static CPU manager container cpuset and contending with vLLM cores (P6 probe: 50ms vs 20ms baseline; runc control: 22ms)"
    spec:
      priorityClassName: colo-backfill
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: cloud.google.com/compute-class, operator: In, values: [g4-gpu]}
              - {key: colo.block.integer, operator: NotIn, values: ["true"]}
      tolerations:
      - {key: cloud.google.com/compute-class, operator: Equal, value: g4-gpu, effect: NoSchedule}
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: sandbox.gke.io/runtime, operator: Equal, value: gvisor, effect: NoSchedule}
      terminationGracePeriodSeconds: 10
      containers:
      - name: worker
        image: us-west8-docker.pkg.dev/northam-ce-mlai-tpu/repo-jawadamin-us-west8-1026/colo-worker:latest
        imagePullPolicy: Always
        env:
        - {name: MODE, value: sandbox}
        ports: [{name: metrics, containerPort: 9100}]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        # Guaranteed QoS + integer CPU => exclusive cores (and admission-policy compliant on G4 nodes).
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "2", memory: 4Gi}


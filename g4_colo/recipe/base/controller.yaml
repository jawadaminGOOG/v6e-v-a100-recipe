# Colo controller: balances backfill (G4 spare cores) vs overflow (N4D) replicas and runs the latency guard.
apiVersion: v1
kind: ServiceAccount
metadata: {name: colo-controller, namespace: colo-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: colo-controller}
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch, patch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: colo-controller}
subjects: [{kind: ServiceAccount, name: colo-controller, namespace: colo-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: colo-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: colo-controller, namespace: colo-svc}
rules:
- apiGroups: [apps]
  resources: [deployments, deployments/scale]
  verbs: [get, list, watch, patch, update]
- apiGroups: [""]
  resources: [pods]
  # patch: controller.kubernetes.io/pod-deletion-cost on drained backfill pods, so ReplicaSet scale-down picks them.
  verbs: [get, list, watch, delete, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: colo-controller, namespace: colo-svc}
subjects: [{kind: ServiceAccount, name: colo-controller, namespace: colo-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: colo-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: colo-controller, namespace: colo-system}
rules:
- apiGroups: [apps]
  resources: [deployments, deployments/scale]
  verbs: [get, list, watch, patch, update]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: colo-controller, namespace: colo-system}
subjects: [{kind: ServiceAccount, name: colo-controller, namespace: colo-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: colo-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: colo-controller-read, namespace: inference}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: colo-controller-read, namespace: inference}
subjects: [{kind: ServiceAccount, name: colo-controller, namespace: colo-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: colo-controller-read}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: colo-config, namespace: colo-system}
data:
  # Recipe defaults. Keys left out fall back to DEFAULT_CONFIG in components/controller/colo_logic.py.
  # - guard.baseline_ttft_p99_ms null: the guard stays inert until you set a baseline (POST /baseline after a
  #   solo run, or edit this value). A hardcoded baseline is only valid for one model + shape + prompt mix.
  # - max_total_cpu = colo-svc-quota requests.cpu (180) - one G4 node's backfill (18 pods x 2 vCPU = 36), so
  #   make-before-break shifts never hit the quota. Raise both together.
  # - ttft_source loadgen: the guard reads per-node TTFT from inference/loadgen (demo). production-template
  #   switches to Managed Prometheus.
  config.json: |
    {"demand": {"sandbox": 10, "toolcall": 9, "analytics": 0},
     "guard": {"enabled": true, "baseline_ttft_p99_ms": null, "factor": 1.5, "cooldown_s": 600, "window_s": 30,
               "escalate_s": 60, "min_requests": 200},
     "buffer_replicas": 1,
     "reserve_cpu_per_node": 2,
     "dehydrate_grace_s": 180,
     "max_total_cpu": 144,
     "ttft_source": {"type": "loadgen"}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: colo-controller, namespace: colo-system, labels: {app: colo-controller}}
spec:
  replicas: 1
  selector: {matchLabels: {app: colo-controller}}
  template:
    metadata: {labels: {app: colo-controller}}
    spec:
      serviceAccountName: colo-controller
      # GKE admits system-cluster-critical outside kube-system only with a matching ResourceQuota
      # (colo-critical-pods below).
      priorityClassName: system-cluster-critical
      nodeSelector: {colo.role: loadgen}
      containers:
      - name: controller
        image: colo-registry.invalid/colo-controller:v0.2.4
        imagePullPolicy: IfNotPresent
        ports: [{name: http, containerPort: 8080}]
        resources:
          requests: {cpu: 200m, memory: 256Mi}
          limits: {memory: 512Mi}
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 5}
        # /healthz returns 503 when the reconcile loop has not finished an iteration for 5 x LOOP_S (after a 60 s
        # startup grace in the controller), so a wedged loop is restarted.
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
---
# Allows system-cluster-critical pods (the controller) in colo-system; GKE rejects them without this quota.
apiVersion: v1
kind: ResourceQuota
metadata: {name: colo-critical-pods, namespace: colo-system}
spec:
  hard: {pods: "4"}
  scopeSelector:
    matchExpressions:
    - {operator: In, scopeName: PriorityClass, values: [system-cluster-critical]}
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata: {name: colo-controller, namespace: colo-system}
spec:
  selector: {matchLabels: {app: colo-controller}}
  endpoints: [{port: http, path: /metrics, interval: 15s}]
---
# Node agent: exposes the kubelet CPU-manager state and per-CPU utilisation (read-only) for the demo node map.
apiVersion: v1
kind: ServiceAccount
metadata: {name: colo-node-agent, namespace: colo-system}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: colo-node-agent, namespace: colo-system, labels: {app: colo-node-agent}}
spec:
  selector: {matchLabels: {app: colo-node-agent}}
  template:
    metadata: {labels: {app: colo-node-agent}}
    spec:
      serviceAccountName: colo-node-agent
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions: [{key: colo.role, operator: In, values: [g4, n4d]}]
      # Only the colo node taints. Not a keyless `operator: Exists`: that also tolerates the Cluster Autoscaler's
      # ToBeDeletedByClusterAutoscaler taint, so agent pods were scheduled onto N4D nodes CA was already deleting
      # and showed as Running but unreachable until the Node object went away (wave-2 live finding).
      tolerations:
      - {key: cloud.google.com/compute-class, operator: Exists, effect: NoSchedule}
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: sandbox.gke.io/runtime, operator: Exists, effect: NoSchedule}
      containers:
      - name: agent
        image: colo-registry.invalid/colo-node-agent:v0.2.4
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        ports: [{name: http, containerPort: 8080}]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
        volumeMounts:
        - {name: kubelet, mountPath: /host/var/lib/kubelet, readOnly: true}
        - {name: proc, mountPath: /host/proc, readOnly: true}
      volumes:
      - {name: kubelet, hostPath: {path: /var/lib/kubelet}}
      - {name: proc, hostPath: {path: /proc}}

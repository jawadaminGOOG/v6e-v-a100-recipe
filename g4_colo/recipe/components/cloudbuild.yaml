# Builds and pushes the colo-at-scale component images. _REGISTRY is required (the build fails with an
# invalid image reference if it is left empty); _TAG must match newTag in your overlay's `images:`.
#   gcloud builds submit g4_colo/recipe/components \
#     --config g4_colo/recipe/components/cloudbuild.yaml \
#     --project "$PROJECT" --region "$REGION" \
#     --substitutions _REGISTRY="$REGION-docker.pkg.dev/$PROJECT/$REPOSITORY",_TAG=v0.2.2
substitutions:
  _REGISTRY: ""
  _TAG: v0.2.2
options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
steps:
  - id: colo-worker
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-t', '${_REGISTRY}/colo-worker:${_TAG}', 'worker']
  - id: colo-loadgen
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-t', '${_REGISTRY}/colo-loadgen:${_TAG}', 'loadgen']
  - id: colo-node-agent
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-t', '${_REGISTRY}/colo-node-agent:${_TAG}', 'node-agent']
  - id: colo-controller
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-t', '${_REGISTRY}/colo-controller:${_TAG}', 'controller']
images:
  - ${_REGISTRY}/colo-worker:${_TAG}
  - ${_REGISTRY}/colo-loadgen:${_TAG}
  - ${_REGISTRY}/colo-node-agent:${_TAG}
  - ${_REGISTRY}/colo-controller:${_TAG}

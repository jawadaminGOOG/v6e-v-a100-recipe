# SPEC CPU 2026 v1.0.1 config for the g4-colo experiment.
# Derived from cloud/performance/artemis/data/speccpu8/speccpu2026-gcc-linux-x86.cfg
# (the GCC example config used by Google's Artemis/PKB harness). Changes:
#   * OPTIMIZE uses -march=x86-64-v3 (portable, matches the Platforms SIR26 prebuild)
#     instead of -march=native.
#   * copies set on the runcpu command line (--copies), no numactl include:
#     pinning is done by the Kubernetes static CPU manager (exclusive cpuset).
# Results are ESTIMATES, not SPEC-reviewed (reportable = 0).
%ifndef %{label}
   label   = g4colo
%else
   label   = %{label}
%endif
%ifndef %{build_ncpus}
%   define  build_ncpus 40
%endif
default:
   bench_post_setup     = sync
   command_add_redirect = 1
   flagsurl             = $[top]/config/flags/gcc.xml
   ignore_errors        = 1
   iterations           = 1
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = --jobs=%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,csv
   preenv               = 1
   reportable           = 0
   tune                 = base
default:
   copies                 = 1
   threads                = 1
default:
%ifndef %{gcc_dir}
%   define gcc_dir "/usr"
%endif
%define GCCge10
   preENV_LD_LIBRARY_PATH  = %{gcc_dir}/lib64/:%{gcc_dir}/lib/:/lib64
   SPECLANG                = %{gcc_dir}/bin/
   CC                      = $(SPECLANG)gcc      -std=c18     -m64
   CXX                     = $(SPECLANG)g++      -std=c++17   -m64
   FC                      = $(SPECLANG)gfortran -std=f2018   -m64
   CC_VERSION_OPTION       = --version
   CXX_VERSION_OPTION      = --version
   FC_VERSION_OPTION       = --version
800.pot3d_s:
  PORTABILITY = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE
710.omnetpp_r:
   PORTABILITY = -fno-finite-math-only
734.vpr_r,834.vpr_s:
   PORTABILITY = -fno-finite-math-only
735.gem5_r,835.gem5_s:
   PORTABILITY = -fno-finite-math-only
736.ocio_r:
   PORTABILITY = -fno-finite-math-only
737.gmsh_r:
   PORTABILITY = -fno-fast-math
748.flightdm_r:
   PORTABILITY = -fno-fast-math
753.ns3_r,853.ns3_s:
   PORTABILITY = -fno-finite-math-only
767.nest_r,867.nest_s:
   PORTABILITY = -fno-finite-math-only
   PORTABILITY_LIBS = -lstdc++fs
%ifdef %{GCCge10}
   default:
      EXTRA_FFLAGS = -fallow-argument-mismatch
%endif
intspeed,fpspeed:
   preENV_OMP_STACKSIZE = 120M
cxxthreads:
   EXTRA_OPTIMIZE  = -pthread
default=base:
   OPTIMIZE       = -g -O3 -march=x86-64-v3
default:
   basepeak = yes
default:
   sw_compiler001   = C/C++/Fortran: GCC 14 (Ubuntu 24.04)
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = Not Applicable
   hw_vendor          = Google Cloud
   tester             = g4-colo experiment
   test_sponsor       = g4-colo experiment
   license_num        = nnn

# G4 share of the Workers: replicas = min(g4_capacity, max(colo.gke.io/total-workers, ceil(busy / 0.8))).
# maxReplicas is a fixed safety cap (60); the user's Total Workers floor lives in the annotation
# colo.gke.io/total-workers so busy headroom can expand g4-workers onto spare G4 cores when a 2nd G4 node scales up.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: g4-workers
  namespace: substrate-exp
  annotations:
    colo.gke.io/total-workers: "15"
spec:
  scaleTargetRef: {apiVersion: ate.dev/v1, kind: WorkerPool, name: g4-workers}
  minReplicas: 0
  maxReplicas: 60
  metrics:
  - type: External
    external:
      metric: {name: "autoscaling.gke.io|substrate-g4-share|g4-share"}
      target: {type: AverageValue, averageValue: "1"}
  behavior:
    # Up: 45 s (same flap guard as the overflow HPA). Down: 90 s (longer than n4d-workers' 60 s so N4D
    # shrinks before G4 on busy jitter, while still well inside G4 ComputeClass's 3 min consolidation delay).
    scaleUp:
      tolerance: 0
      stabilizationWindowSeconds: 45
      policies: [{type: Percent, value: 100, periodSeconds: 15}]
    scaleDown:
      tolerance: 0
      stabilizationWindowSeconds: 90
      policies: [{type: Percent, value: 100, periodSeconds: 15}]

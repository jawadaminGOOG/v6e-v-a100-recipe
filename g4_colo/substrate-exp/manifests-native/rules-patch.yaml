- op: replace
  path: /spec/groups/0/rules/1/expr
  value: |-
    count(
      (substrate_exp_kube_pod_info{exported_namespace="substrate-exp",exported_pod=~"g4-workers-.+"} and (time() - timestamp(substrate_exp_kube_pod_info{exported_namespace="substrate-exp",exported_pod=~"g4-workers-.+"}) < 45))
      * on (exported_namespace, exported_pod) group_left ()
        ((substrate_exp_kube_pod_status_ready{exported_namespace="substrate-exp",condition="true"} and (time() - timestamp(substrate_exp_kube_pod_status_ready{exported_namespace="substrate-exp",condition="true"}) < 45)) == 1)
      * on (node) group_left ()
        max by (node) (
          ((substrate_exp_kube_pod_info{exported_namespace="inference",exported_pod=~"vllm-.+"} and (time() - timestamp(substrate_exp_kube_pod_info{exported_namespace="inference",exported_pod=~"vllm-.+"}) < 45))
           unless on (exported_namespace, exported_pod) (substrate_exp_kube_pod_deletion_timestamp{exported_namespace="inference"} and (time() - timestamp(substrate_exp_kube_pod_deletion_timestamp{exported_namespace="inference"}) < 45)))
          * on (exported_namespace, exported_pod) group_left ()
            ((substrate_exp_kube_pod_status_ready{exported_namespace="inference",condition="true"} and (time() - timestamp(substrate_exp_kube_pod_status_ready{exported_namespace="inference",condition="true"}) < 45)) == 1))
      unless on (exported_namespace, exported_pod)
        (substrate_exp_kube_pod_deletion_timestamp{exported_namespace="substrate-exp"} and (time() - timestamp(substrate_exp_kube_pod_deletion_timestamp{exported_namespace="substrate-exp"}) < 45))
    ) or (substrate_g4_desired * 0)
